cat > config/slam.yaml << 'EOF'
feature_tracker:
  detector: ORB
  max_features: 2000
  scale_factor: 1.2
  num_levels: 8

visual_odometry:
  ransac_threshold: 1.0
  minimum_matches: 30

loop_closure:
  enabled: true
  min_loop_score: 0.75

pose_graph:
  optimization_frequency_hz: 1.0

localization:
  publish_rate_hz: 30.0
EOF